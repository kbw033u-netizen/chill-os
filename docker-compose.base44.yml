services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - CHILLOS_HOST=0.0.0.0
      - CHILLOS_PORT=3000
      - BASE44_PREVIEW_MODE
    command: ["python", "-m", "chill.gui.server"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
